<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food Fight</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed WebGL canvas split into per-player viewports, each with a quiet tactical HUD.
   Menus are dark field-map sheets: tabs across the top, mission cards and briefing below. */
:root {
  --ink: #eef0e8;
  --ink-dim: #b3b8a8;
  --ink-faint: #858b7c;
  --glass: rgba(18, 14, 34, 0.9);
  --glass-2: rgba(255, 255, 255, 0.05);
  --line: rgba(214, 220, 196, 0.14);
  --sand: #ffcc33;
  --sand-deep: #d08a10;
  --friend: #4ad0ff;
  --foe: #ff3a2a;
  --obj: #ffd060;
  --hp: #eef0e8;
  --hp-low: #ff6b5a;
  --plate: #8fb6d8;
  --night: #0c0a16;
  --font-display: 'Bungee', 'Arial Black', Impact, sans-serif;
  --font-body: 'Fredoka', 'Segoe UI', system-ui, sans-serif;
  --font-hud: 'Fredoka', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--night); color: var(--ink); font-family: var(--font-body); }
canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hidden { display: none !important; }
.overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box; z-index: 20;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet { width: min(1180px, 100%); max-height: 100%; overflow: auto; box-sizing: border-box; background: var(--glass);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 14px;
  padding: 22px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 30px 90px rgba(0,0,0,.55); }
.sheet.narrow { width: min(760px, 100%); }
.brand { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 5.6vw, 56px); line-height: .95; letter-spacing: 1px; text-wrap: balance; }
.brand h1 span { color: var(--sand); }
.brand p { margin: 0; max-width: 56ch; color: var(--ink-dim); font-size: 14.5px; line-height: 1.45; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.tabs button { font: 700 13px var(--font-body); letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-dim); background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
.tabs button.on { color: #1a1608; background: var(--sand); }
.tabs button:hover:not(.on) { border-color: var(--line); }
h2.sec { margin: 0 0 10px; font: 700 12px var(--font-body); letter-spacing: 2px; text-transform: uppercase; color: var(--sand); }
h3 { margin: 0; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 18px; }
@media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
.missions { display: flex; flex-direction: column; gap: 8px; }
.mcard { text-align: left; font: inherit; color: var(--ink); background: var(--glass-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; display: grid; grid-template-columns: 34px 1fr auto; gap: 4px 12px; align-items: center; }
.mcard .no { font-family: var(--font-display); font-size: 22px; color: var(--sand); }
.mcard b { font-size: 16px; } .mcard small { grid-column: 2; color: var(--ink-faint); font-size: 12.5px; }
.mcard .st { font: 700 11px var(--font-body); letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint); }
.mcard .st.done { color: var(--friend); }
.mcard.sel { border-color: var(--sand); box-shadow: 0 0 0 1px var(--sand) inset; }
.mcard:disabled { opacity: .45; cursor: not-allowed; }
.brief { border: 1px solid var(--line); border-radius: 10px; padding: 16px; background: var(--glass-2); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.brief .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font: 600 12.5px var(--font-hud); letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint); }
.brief h3 { font-family: var(--font-display); font-weight: 400; font-size: 26px; }
.brief p { margin: 0; color: var(--ink-dim); line-height: 1.5; font-size: 14.5px; max-width: 70ch; }
.brief ol { margin: 0; padding-left: 20px; color: var(--ink); line-height: 1.6; font-size: 14px; }
.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.slot { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--glass-2); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.slot .hd { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.slot .hd b { font-family: var(--font-hud); font-size: 18px; letter-spacing: 1px; }
.slot .hd span { color: var(--ink-faint); font-size: 12px; }
label.fld { display: flex; flex-direction: column; gap: 4px; font: 700 11px var(--font-body); letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint); }
select { font: 600 13.5px var(--font-body); color: var(--ink); background: rgba(0,0,0,.45); border: 1px solid var(--line); border-radius: 7px; padding: 7px 8px; width: 100%; }
.wdesc { color: var(--ink-dim); font-size: 12.5px; line-height: 1.35; min-height: 2.6em; margin: 0; }
.rankbar { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
.rank { font-family: var(--font-hud); font-size: 22px; font-weight: 700; letter-spacing: 1px; }
.xpb { flex: 1; min-width: 200px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; }
.xpb i { display: block; height: 100%; background: var(--sand); }
.pts { font: 700 13px var(--font-body); color: var(--sand); }
.skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.skill { text-align: left; font: inherit; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--glass-2); cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.skill b { font-size: 15px; } .skill p { margin: 0; color: var(--ink-dim); font-size: 13px; line-height: 1.4; }
.skill .s { font: 700 11px var(--font-body); letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint); }
.skill.own { border-color: var(--friend); } .skill.own .s { color: var(--friend); }
.skill:disabled { cursor: default; }
.keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px 24px; }
.keys table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.keys th { text-align: left; font: 700 12px var(--font-body); letter-spacing: 1.5px; text-transform: uppercase; color: var(--sand); padding-bottom: 6px; }
.keys td { padding: 3px 0; color: var(--ink-dim); vertical-align: top; }
.keys td:first-child { color: var(--ink); width: 44%; }
kbd { font: 700 11.5px var(--font-body); background: rgba(255,255,255,.1); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; white-space: nowrap; }
.bar { display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: center; justify-content: space-between; }
.ctl { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-dim); }
.ctl select { width: auto; }
input[type=range] { accent-color: var(--sand); width: 130px; }
.go { font-family: var(--font-display); font-size: 20px; letter-spacing: 2px; color: #1a1608; border: 0; border-radius: 9px; padding: 12px 32px; cursor: pointer;
  background: linear-gradient(180deg, #ecdcaa, var(--sand) 60%, var(--sand-deep)); box-shadow: 0 4px 0 #5e522c; }
.go:active { transform: translateY(2px); box-shadow: 0 2px 0 #5e522c; }
.go:disabled { filter: grayscale(1) brightness(.6); cursor: not-allowed; }
.plain { font: 700 14px var(--font-body); color: var(--ink); background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 9px; padding: 10px 18px; cursor: pointer; }
.err { color: #ff9a8a; font-size: 13px; }
.note { color: var(--ink-faint); font-size: 13px; line-height: 1.45; margin: 0; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--sand); outline-offset: 2px; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end; align-items: center; }
.stat-row { display: grid; grid-template-columns: 1fr auto; gap: 6px 20px; font-size: 14.5px; }
.stat-row span:nth-child(even) { text-align: right; font: 700 16px var(--font-hud); font-variant-numeric: tabular-nums; }
.choices-made { color: var(--ink-dim); font-size: 14px; line-height: 1.5; margin: 0; }

/* HUD */
#views { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
.view { position: absolute; overflow: hidden; font-family: var(--font-hud); --fs: 14px; font-size: var(--fs); color: var(--ink); text-shadow: 0 1px 2px rgba(0,0,0,.85); }
.view.sl { border-right: 2px solid #000; } .view.st { border-bottom: 2px solid #000; }
.ads { position: absolute; left: 50%; top: 50%; width: 9em; height: 9em; margin: -4.5em 0 0 -4.5em; opacity: 0; pointer-events: none; }
.ads svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 1.5px rgba(255,40,30,.6)); }
.ads.dark svg { filter: drop-shadow(0 0 1px rgba(0,0,0,.8)); }
.scope2 { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
.scope2 svg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.nvg { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(40,255,90,.05) 40%, rgba(0,20,0,.85) 100%); opacity: 0; }
.vig { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, transparent 50%, rgba(150,10,10,.6) 100%); }
.xh { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.xh i { position: absolute; background: rgba(255,255,255,.9); box-shadow: 0 0 2px #000; }
.xh i:nth-child(1), .xh i:nth-child(2) { width: 2px; height: .6em; left: -1px; }
.xh i:nth-child(3), .xh i:nth-child(4) { height: 2px; width: .6em; top: -1px; }
.xh .dot { position: absolute; width: 3px; height: 3px; left: -1.5px; top: -1.5px; border-radius: 50%; background: rgba(255,255,255,.9); }
.hm { position: absolute; left: 50%; top: 50%; width: 2.4em; height: 2.4em; transform: translate(-50%, -50%) rotate(45deg); opacity: 0; }
.hm::before, .hm::after { content: ""; position: absolute; background: #fff; }
.hm::before { left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; clip-path: polygon(0 0,100% 0,100% 30%,0 30%,0 70%,100% 70%,100% 100%,0 100%); }
.hm::after { top: 50%; left: 0; right: 0; height: 2px; margin-top: -1px; clip-path: polygon(0 0,30% 0,30% 100%,0 100%,0 0,70% 0,100% 0,100% 100%,70% 100%); }
.hm.kill::before, .hm.kill::after { background: var(--foe); }
.dd { position: absolute; left: 50%; top: 50%; width: 10em; height: 10em; margin: -5em 0 0 -5em; opacity: 0; }
.dd::before { content: ""; position: absolute; left: 50%; top: 0; width: 3.4em; height: .55em; margin-left: -1.7em; border-radius: 50% 50% 0 0 / 100% 100% 0 0; background: rgba(255,60,40,.85); }
.me { position: absolute; left: 1.2em; bottom: 1.1em; width: min(17em, 40%); display: flex; flex-direction: column; gap: .3em; }
.me .nm { font-weight: 700; letter-spacing: 1px; text-transform: uppercase; font-size: 1.05em; display: flex; gap: .5em; align-items: baseline; }
.me .nm span { color: var(--ink-faint); font-size: .85em; }
.hpb { position: relative; height: 1em; border-radius: .2em; background: rgba(0,0,0,.55); overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.12) inset; }
.hpb i { position: absolute; inset: 0 auto 0 0; background: var(--hp); }
.hpb.low i { background: var(--hp-low); }
.hpb b { position: absolute; right: .4em; top: 50%; transform: translateY(-50%); font-size: .8em; color: #121410; text-shadow: none; }
.hpb.low b { color: #fff; }
.plates { display: flex; gap: .25em; } .plates i { flex: 1; height: .35em; border-radius: .15em; background: rgba(0,0,0,.5); overflow: hidden; position: relative; }
.plates i b { position: absolute; inset: 0 auto 0 0; background: var(--plate); }
.stam { height: .22em; border-radius: .1em; background: rgba(0,0,0,.45); overflow: hidden; } .stam i { display: block; height: 100%; background: rgba(238,240,232,.55); }
.wp { position: absolute; right: 1.2em; bottom: 1.1em; text-align: right; display: flex; flex-direction: column; gap: .15em; align-items: flex-end; }
.wp .am { font-size: 2.1em; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.wp .am small { font-size: .5em; color: var(--ink-dim); margin-left: .2em; }
.wp .wn { font-size: .9em; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-dim); }
.wp .eq { display: flex; gap: .7em; font-size: .85em; font-weight: 600; letter-spacing: .5px; color: var(--ink-dim); }
.wp .eq b { color: var(--ink); }
.wp .low { color: var(--hp-low); }
.compass { position: absolute; left: 50%; top: .8em; width: min(26em, 60%); height: 1.6em; transform: translateX(-50%); overflow: hidden;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent); mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent); }
.compass .tk { position: absolute; top: 0; transform: translateX(-50%); font-size: .8em; font-weight: 700; color: var(--ink-dim); }
.compass .tk.c { color: var(--ink); }
.compass .ob { position: absolute; top: .95em; width: .55em; height: .55em; margin-left: -.275em; background: var(--obj); transform: rotate(45deg); }
.compass::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 2px; height: .4em; background: var(--ink); }
.objbox { position: absolute; right: 1.2em; top: 1em; width: min(18em, 38%); text-align: right; display: flex; flex-direction: column; gap: .2em; }
.objbox .mn { font-size: .78em; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; }
.objbox .ot { font-size: 1.05em; font-weight: 700; line-height: 1.15; color: var(--obj); }
.objbox .op { font-size: .9em; color: var(--ink-dim); }
.squad { position: absolute; left: 1.2em; top: 1em; display: flex; flex-direction: column; gap: .3em; }
.squad .r { display: grid; grid-template-columns: 6.5em 4.5em auto; gap: .5em; align-items: center; font-size: .82em; font-weight: 600; letter-spacing: .4px; }
.squad .r .bb { height: .3em; border-radius: .15em; background: rgba(0,0,0,.5); overflow: hidden; } .squad .r .bb i { display: block; height: 100%; background: var(--friend); }
.squad .r .s { color: var(--ink-faint); font-size: .9em; text-transform: uppercase; }
.squad .r.down .s { color: var(--hp-low); } .squad .r.kia { opacity: .4; }
.mk { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; font-size: .8em; font-weight: 700; white-space: nowrap; }
.mk i { width: .7em; height: .7em; transform: rotate(45deg); margin-top: .2em; }
.mk.obj { color: var(--obj); } .mk.obj i { background: var(--obj); }
.mk.foe i { background: var(--foe); width: .5em; height: .5em; } .mk.foe { color: var(--foe); }
.mk.rev { color: var(--friend); } .mk.rev i { background: var(--friend); border-radius: 50%; transform: none; }
.mk.ally { color: var(--friend); } .mk.ally i { width: .45em; height: .45em; background: var(--friend); border-radius: 50%; transform: none; }
.prompt { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); text-align: center; font-weight: 700; font-size: 1em; letter-spacing: .5px; }
.prompt .pb { width: 9em; height: .3em; margin: .35em auto 0; border-radius: .15em; background: rgba(0,0,0,.5); overflow: hidden; } .prompt .pb i { display: block; height: 100%; background: var(--sand); }
.xp { position: absolute; left: 58%; top: 44%; display: flex; flex-direction: column; gap: .1em; font-weight: 700; font-size: .95em; color: var(--sand); }
.xp div { transition: opacity .4s, transform .4s; }
.vmsg { position: absolute; left: 50%; top: 28%; transform: translateX(-50%); text-align: center; font-weight: 700; font-size: 1.4em; letter-spacing: 1px; white-space: nowrap; }
.vmsg small { display: block; font-size: .62em; color: var(--ink-dim); font-weight: 600; margin-top: .2em; }
.mhint { position: absolute; left: 50%; bottom: 7em; transform: translateX(-50%); padding: .35em .9em; border-radius: .4em; background: rgba(0,0,0,.6); font-size: .95em; font-weight: 600; white-space: nowrap; }
.drone { position: absolute; inset: 0; opacity: 0; }
.drone.on { opacity: 1; }
.drone .fr { position: absolute; inset: 8%; border: 2px solid rgba(255,255,255,.35); border-radius: 6px; }
.drone .tl { position: absolute; left: 10%; top: 10%; font-weight: 700; letter-spacing: 1px; }
.drone .tr { position: absolute; right: 10%; top: 10%; text-align: right; font-weight: 700; letter-spacing: 1px; }
.drone .bt { position: absolute; left: 50%; bottom: 10%; transform: translateX(-50%); font-weight: 600; color: var(--ink-dim); white-space: nowrap; }
.drone .rec { color: var(--foe); }
.chute { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); text-align: center; font-weight: 700; font-size: 1.1em; }
.chute small { display: block; color: var(--ink-dim); font-weight: 600; font-size: .8em; }
.callout { position: absolute; left: 50%; top: 3.2em; transform: translateX(-50%); text-align: center; padding: .5em 1.3em .6em; background: rgba(8,10,8,.74); border-top: 2px solid var(--obj); border-radius: .3em; max-width: 72%; opacity: 0; transition: opacity .5s; }
.callout .k { font-size: .72em; letter-spacing: 2.5px; color: var(--obj); font-weight: 700; text-transform: uppercase; }
.callout .t { font-size: 1.3em; font-weight: 700; line-height: 1.15; }
.callout .w { font-size: .92em; color: var(--ink-dim); margin-top: .2em; line-height: 1.3; }
.mm { position: absolute; left: 1.2em; top: 1em; width: 11em; height: 11em; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.2) inset, 0 2px 8px rgba(0,0,0,.5); }
.mm canvas { width: 100%; height: 100%; display: block; }
.objbox .why { font-size: .82em; color: var(--ink-dim); line-height: 1.25; }
#radio { position: fixed; left: 50%; bottom: max(104px, calc(env(safe-area-inset-bottom, 0px) + 104px)); transform: translateX(-50%); z-index: 8; pointer-events: none;
  width: min(640px, calc(100% - 32px)); background: rgba(8,10,8,.78); border-left: 3px solid var(--sand); border-radius: 6px; padding: 8px 14px; font-family: var(--font-hud); font-size: 16px; line-height: 1.35; transition: opacity .3s; }
#radio b { color: var(--sand); letter-spacing: 1px; text-transform: uppercase; font-size: 13px; display: block; }
#choice { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 9; width: min(560px, calc(100% - 32px)); background: rgba(8,10,8,.92); border: 1px solid var(--sand); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; font-family: var(--font-body); }
#choice p { margin: 0; line-height: 1.45; color: var(--ink-dim); }
#choice button { text-align: left; font: 600 14.5px var(--font-body); color: var(--ink); background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
#choice button kbd { margin-right: 8px; }
#banner { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; z-index: 7; text-align: center; gap: 6px; }
#banner .t { font-family: var(--font-display); font-size: clamp(36px, 8vw, 84px); letter-spacing: 3px; text-shadow: 0 4px 16px rgba(0,0,0,.8); }
#banner .s { font: 600 clamp(14px, 2vw, 18px) var(--font-hud); letter-spacing: 3px; text-transform: uppercase; color: var(--sand); text-shadow: 0 2px 6px #000; }
#banner.fade { animation: bfade 4.2s forwards; }
@keyframes bfade { 0% { opacity: 0; } 12% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #banner.fade { animation: none; } }
#loading { background: radial-gradient(ellipse at 50% 40%, #1d2418 0%, #070906 75%); }
.load { width: min(560px, 100%); display: flex; flex-direction: column; gap: 12px; }
.load .lm { font: 700 12px var(--font-body); letter-spacing: 2px; text-transform: uppercase; color: var(--sand); }
.load h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(34px, 7vw, 60px); line-height: 1; }
.load p { margin: 0; color: var(--ink-dim); line-height: 1.5; font-size: 15px; min-height: 3em; }
.lbar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
.lbar i { display: block; height: 100%; width: 0; background: var(--sand); transition: width .25s; }
.lstep { font: 600 13px var(--font-hud); letter-spacing: 1px; color: var(--ink-faint); text-transform: uppercase; }

function mountains(K, color, from = 0, to = Math.PI * 2, dist = 330, n = 14) {
  // hazy ridgelines: the color is pulled toward the fog so they read as far away
  const col = new THREE.Color(color).lerp(scene.fog.color, .45);
  const m = new THREE.MeshLambertMaterial({ color: col, flatShading: true, fog: false });
  for (let i = 0; i < n * 2; i++) {
    const a = from + (to - from) * (i / 2 + rand(-.4, .4)) / n, d = dist + 80 + rand(-30, 90), h = rand(60, 130), r = rand(110, 190);
    const geo = new THREE.ConeGeometry(r, h, 11, 3);
    const pp = geo.attributes.position; for (let k = 0; k < pp.count; k++) if (pp.getY(k) < h / 2 - .1) { pp.setX(k, pp.getX(k) * rand(.8, 1.15)); pp.setZ(k, pp.getZ(k) * rand(.8, 1.15)); pp.setY(k, pp.getY(k) + rand(-6, 6)); }
    geo.computeVertexNormals();
    const c = new THREE.Mesh(geo, m); c.scale.set(1, 1, rand(.6, 1));
    c.position.set(Math.sin(a) * d, -5 + h / 2, -Math.cos(a) * d); c.rotation.y = rand(0, 3);
    world.group.add(c);
  }
}
function windTurbine(K, x, z, h = 46) {
  const y = Math.min(K.gy(x, z), -.5);
  K.C(.5, .95, h, x, y, z, MATS.white, { seg: 14 });
  K.D(G.box(1.6, 1.6, 4), MATS.white, [x, y + h + .6, z]);
  const hub = pivot(world.group, x, y + h + .6, z + 2.2);
  addM(hub, G.sph(.6, 12, 8), MATS.white);
  for (let i = 0; i < 3; i++) { const b = pivot(hub, 0, 0, 0); b.rotation.z = i * Math.PI * 2 / 3; addM(b, G.box(.9, 19, .25), MATS.white, [0, 9.8, 0]); }
  const sp = rand(.5, .9);
  world.anim.push((t, dt) => { hub.rotation.z += dt * sp; });
}
function powerLine(K, pts) {
  const wire = mat(0x1a1a1a, { r: .8 });
  const tops = pts.map(([x, z]) => { const y = K.gy(x, z); K.C(.13, .17, 9, x, y, z, MATS.bark, { seg: 7, rs: 1.5 }); K.D(G.box(2.2, .14, .14), MATS.bark, [x, y + 8.6, z]); return new THREE.Vector3(x, y + 8.7, z); });
  for (let i = 0; i < tops.length - 1; i++) for (const off of [-.9, .9]) {
    const a = tops[i].clone(), b = tops[i + 1].clone(); a.x += off * .3; b.x += off * .3; a.z += off; b.z += off;
    const mid = a.clone().add(b).multiplyScalar(.5); mid.y -= 1;
    for (const [p, q] of [[a, mid], [mid, b]]) { const o = limbBox(world.group, p, q, .03, wire); o.receiveShadow = false; }
  }
}

function renderViews() {

// =====================================================================
// Simulation step and main loop
// =====================================================================
function step(dt) {
  game.time += dt;
  if (game.orderMark) game.orderMark.t -= dt;
  for (const a of actors) {
    a.t += dt;
    if (a.human) {
      const inp = a.ctrl.read(dt);
      if (inp.pause) { togglePause(); tapped.clear(); return; }
      updateHuman(a, game.result ? Object.assign({}, BLANK, { lookDX: inp.lookDX, lookDY: inp.lookDY }) : inp, dt);
    } else if (a.dead) continue;
    else if (a.frozenT > 0) { a.frozenT -= dt; a.weaponTick(dt); moveActor(a, 0, 0, dt); }
    else { try { if (game.pvp) pvpBot(a, dt); else if (a.team === 'pla') enemyAI(a, dt); else friendlyAI(a, dt); } catch (e) { reportError(e); a.ai.state = 'idle'; } }
    a.spottedT = Math.max(0, a.spottedT - dt); if (a.shieldT > 0) a.shieldT -= dt;
  }
  for (let i = 0; i < actors.length; i++) {
    const a = actors[i]; if (a.dead || a.chute) continue;
    for (let j = i + 1; j < actors.length; j++) {
      const b = actors[j]; if (b.dead || b.chute || Math.abs(a.pos.y - b.pos.y) > 1.5) continue;
      const dx = b.pos.x - a.pos.x, dz = b.pos.z - a.pos.z, d = Math.hypot(dx, dz), min = RADIUS * 2;
      if (d < min && d > 1e-4) { const p = (min - d) / 2; a.pos.x -= dx / d * p; a.pos.z -= dz / d * p; b.pos.x += dx / d * p; b.pos.z += dz / d * p; }
    }
  }
  for (let i = entities.length - 1; i >= 0; i--) { let keep = false; try { keep = entities[i].update(dt); } catch (e) { reportError(e); } if (!keep) { try { entities[i].dispose(); } catch (e) { /* already gone */ } entities.splice(i, 1); } }
  if (!game.result) { objectiveStep(dt); checkFailure(); reinforcements(dt); eventDirector(dt); skyChaos(dt); }
  else { game.endT -= dt; if (game.endT <= 0) debrief(); }
  for (let i = actors.length - 1; i >= 0; i--) { const a = actors[i]; if (a.dead && (a.deathT || 0) > 45 && (a.team === 'pla' || a.kind === 'ally')) { a.dispose(); actors.splice(i, 1); for (let j = interacts.length - 1; j >= 0; j--) if (interacts[j].corpse === a) interacts.splice(j, 1); } }
  updateRadio(dt);

}
// Enemies never run out: small groups keep arriving out of sight, capped so it never swamps you
function reinforcements(dt) {

  const L = squadLeader(); if (!L || L.chute) return;
  game.reinfT -= dt;
  if (game.reinfT > 0) return;
  game.reinfT = rand(40, 60) - profile.diff * 5;
  const near = actors.filter(a => a.team === 'pla' && !a.dead && a.pos.distanceTo(L.pos) < 100).length;
  const cap = 6 + profile.diff * 2;
  if (near >= cap) return;
  const n = Math.max(1, Math.min(cap - near, [2, 3, 4][profile.diff] - (Math.random() < .4 ? 1 : 0)));
  for (let tries = 0; tries < 40; tries++) {
    const ang = rand(0, Math.PI * 2), d = rand(55, 85);
    const x = L.pos.x + Math.sin(ang) * d, z = L.pos.z + Math.cos(ang) * d;
    if (Math.abs(x) > world.size - 6 || Math.abs(z) > world.size - 6) continue;
    const gy = groundAt(x, z, 80);
    if (gy < world.seaLevel + .6 || zoneAt(x, z, gy) || pointInSolid(new THREE.Vector3(x, gy + 1, z), .6)) continue;
    const head = new THREE.Vector3(x, gy + 1.5, z);
    if (actors.some(h => h.human && !h.dead && lineOfSight(h.eye(), head))) continue;
    const K = makeBuilder();
    for (let i = 0; i < n; i++) {
      const e = K.enemy(x + rand(-2.5, 2.5), z + rand(-2.5, 2.5), { tag: 'reinf', type: i === 0 && Math.random() < .25 ? 'mg' : 'rifle', weapon: undefined });
      if (e.type === 'mg') { e.weapons[0] = { id: 'qjb', def: ENEMY_WEAPONS.qjb, mag: 100, reserve: 600 }; }
      aiAlert(e, L.pos.clone().add(new THREE.Vector3(rand(-10, 10), 0, rand(-10, 10))), null); e.ai.alertT = 45;
    }
    if (Math.random() < .7) radioLine(pick(['Cpl. Okafor', 'Spc. Chen', 'Pfc. Ortega']), pick(['More of them moving in.', 'New enemy squad coming up on us.', 'Contact. Small group, closing in.', 'Heads up, reinforcements.']), 2);

}
function resize() { renderer.setSize(innerWidth, innerHeight, false); if (mode !== 'debrief') layoutViews(); }

// ---------- stability: quality levels, frame-time governor, error and context-loss recovery ----------
const QUALITY = ['low', 'medium', 'high'];

const perf = { acc: 0, n: 0, slowT: 0, cool: 0 };
function governor(rdt) {

  perf.acc += rdt; perf.n++; perf.cool -= rdt;

let noticeT = 0;

}, false);

  { const L = actors.find(a => a.human && !a.dead) || squadLeader();

  const pc = $('playerChip'); if (pc) pc.innerHTML = `<span>Playing as <b>${(ACCOUNT.name || 'Guest').replace(/</g, '&lt;')}</b></span>${coinTag}<button type="button" class="plain sm" id="btnSwitch">Switch player</button>`;
  if ($('btnSwitch')) $('btnSwitch').onclick = () => showUserModal(true);
  const card = (kind, id, d, owned, sel) => `<div class="scard ${sel ? 'sel' : ''}"><canvas width="120" height="150" data-${kind}="${id}"></canvas><b>${d.name}</b>
    ${owned ? `<button type="button" class="${sel ? 'plain' : 'go'} sm" data-eq-${kind}="${id}" ${sel ? 'disabled' : ''}>${sel ? 'Equipped' : 'Equip'}</button>` : `<button type="button" class="go sm" data-buy-${kind}="${id}" ${profile.coins < d.price ? 'disabled' : ''}><span class="coinpill sm"><i></i>${d.price}</span> Buy</button>`}</div>`;
  $('tab-shop').innerHTML = `<div class="shophd">${coinTag}<p class="note">Earn coins by grabbing the coins enemies drop, finding intel, opening supply caches and finishing missions. Coins are separate from XP.</p></div>
    <h2 class="sec">Chef outfits</h2><div class="shopgrid">${Object.entries(SKINS).filter(([, d]) => !d.hidden).map(([id, d]) => card('skin', id, d, profile.skinsOwned.includes(id), profile.skinSel === id)).join('')}</div>
    <h2 class="sec">Blaster paint</h2><p class="note">Paints every food blaster you carry.</p><div class="shopgrid">${Object.entries(FINISHES).map(([id, d]) => card('fin', id, d, profile.finOwned.includes(id), profile.finSel === id)).join('')}</div>`;
  $('tab-shop').querySelectorAll('canvas[data-skin]').forEach(cv => drawSkinPreview(cv, cv.dataset.skin));
  $('tab-shop').querySelectorAll('canvas[data-fin]').forEach(cv => drawFinishPreview(cv, cv.dataset.fin));
  const act = (sel, fn) => $('tab-shop').querySelectorAll(sel).forEach(b => b.addEventListener('click', () => { fn(b); saveProfile(); renderMenu(); }));
  act('[data-buy-skin]', b => { const id = b.dataset.buySkin, d = SKINS[id]; if (profile.coins >= d.price) { profile.coins -= d.price; profile.skinsOwned.push(id); profile.skinSel = id; Sfx.init(); Sfx.play('streak'); } });

  const H = profile.history || [];
  $('tab-history').innerHTML = H.length ? `<table class="hist"><thead><tr><th>When</th><th>Mission</th><th>Result</th><th>Takedowns</th><th>Intel</th><th>Coins</th><th>XP</th></tr></thead><tbody>${H.map(r => `<tr><td>${new Date(r.when).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</td><td>${r.mission}</td><td>${r.result}</td><td>${r.takedowns}</td><td>${r.intel || '-'}</td><td>+${r.coins}</td><td>+${r.xp}</td></tr>`).join('')}</tbody></table>`
    : '<p class="note">No missions played yet. Your games show up here.</p>';
}
function drawFinishPreview(cv, id) {
