<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dennis Pezan | USMA 2029</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oswald:wght@300;400;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #0a0a0a;
      color: #c8c8c8;
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,255,70,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,70,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
      padding: 48px;
      border: 1px solid #2a2a2a;
      background: rgba(10,10,10,0.85);
      width: min(680px, 92vw);
    }

    .container::before, .container::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: #4a7c4e;
      border-style: solid;
    }
    .container::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .container::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    .top-label  { font-size: 11px; letter-spacing: 6px; color: #4a7c4e; text-transform: uppercase; }
    .crest      { width: 72px; height: 72px; }
    .name       { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: clamp(28px,6vw,44px); letter-spacing: 8px; text-transform: uppercase; color: #e8e8e8; text-align: center; }
    .class-tag  { font-size: 13px; letter-spacing: 4px; color: #4a7c4e; text-transform: uppercase; }

    .divider { width: 100%; display: flex; align-items: center; gap: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #2a2a2a; }
    .divider span { font-size: 10px; letter-spacing: 3px; color: #3a3a3a; }

    .clock-block { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .clock-label { font-size: 10px; letter-spacing: 5px; color: #3d6b41; text-transform: uppercase; }
    .clock       { font-size: clamp(42px,10vw,72px); font-family: 'Share Tech Mono', monospace; color: #57ff6e; letter-spacing: 4px; text-shadow: 0 0 18px rgba(87,255,110,0.35); }
    .clock-date  { font-size: 13px; letter-spacing: 3px; color: #5a5a5a; text-transform: uppercase; }

    .motto { font-size: 11px; letter-spacing: 5px; color: #3a3a3a; text-transform: uppercase; text-align: center; }

    .bottom-bar { display: flex; justify-content: space-between; width: 100%; border-top: 1px solid #1e1e1e; padding-top: 14px; font-size: 10px; letter-spacing: 3px; color: #2e2e2e; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-label">United States Military Academy</div>

    <svg class="crest" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M36 4 L68 18 L68 42 C68 56 52 66 36 70 C20 66 4 56 4 42 L4 18 Z" fill="#0d1a0e" stroke="#4a7c4e" stroke-width="1.5"/>
      <path d="M36 14 L58 24 L58 41 C58 51 48 59 36 63 C24 59 14 51 14 41 L14 24 Z" fill="#111f12" stroke="#3a6a3e" stroke-width="1"/>
      <text x="36" y="48" text-anchor="middle" font-family="Oswald, sans-serif" font-size="22" font-weight="600" fill="#4a7c4e" letter-spacing="1">A</text>
      <polygon points="36,17 37.5,22 42,22 38.5,25 40,30 36,27 32,30 33.5,25 30,22 34.5,22" fill="#4a7c4e"/>
    </svg>

    <div class="name">Dennis Pezan</div>
    <div class="class-tag">Class of 2029 &nbsp;&#9632;&nbsp; West Point</div>

    <div class="divider"><span>&#9632;</span></div>

    <div class="clock-block">
      <div class="clock-label">Local Time</div>
      <div class="clock" id="clock">--:--:--</div>
      <div class="clock-date" id="date">---</div>
    </div>

    <div class="divider"><span>&#9632;</span></div>

    <div class="motto">Duty &nbsp;&#183;&nbsp; Honor &nbsp;&#183;&nbsp; Country</div>

    <div class="bottom-bar">
      <span>USMA</span>
      <span id="zulu">ZULU --:--</span>
      <span>2029</span>
    </div>
  </div>

  <script>
    const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    function pad(n) { return String(n).padStart(2,'0'); }
    function tick() {
      const now = new Date();
      document.getElementById('clock').textContent = pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
      document.getElementById('date').textContent  = DAYS[now.getDay()]+'  '+pad(now.getDate())+' '+MONTHS[now.getMonth()]+' '+now.getFullYear();
      document.getElementById('zulu').textContent  = 'ZULU '+pad(now.getUTCHours())+':'+pad(now.getUTCMinutes());
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
